name: Fabric CI

on:
  pull_request:
    branches:
      - dev
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Fabric files
        run: |
          echo "Validating Fabric deployment files..."
          find . -type f | sort
